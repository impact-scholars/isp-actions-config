name: build and deploy MyST paper (pages for main, cloudflare for previews)

on:
  workflow_call:
    inputs:
      target:
        description: "'pages' for GitHub Pages or 'cloudflare' for Cloudflare Pages preview"
        required: false
        type: string
        default: "pages"
      paper-environment-file:
        description: "Name of the paper-specific environment file (optional)"
        required: false
        type: string
        default: "paper-environment.yml"
      base_url:
        description: "Where the website is served from, including CSS & JS assets (needed for MyST)"
        required: false
        type: string
        default: "/${{ github.event.repository.name }}"
      cf-project-name:
        description: "Cloudflare Pages project name for preview deployments"
        required: false
        type: string
        default: "impact-scholars"
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write
  deployments: write

concurrency:
  group: ${{ inputs.target == 'pages' && 'pages' || format('preview-{0}', github.head_ref) }}
  cancel-in-progress: ${{ inputs.target == 'cloudflare' }}

jobs:
  build:
    uses: impact-scholars/isp-actions-config/.github/workflows/build-paper.yml@main
    with:
      paper-environment-file: ${{ inputs.paper-environment-file }}
      base_url: ${{ inputs.base_url }}

  deploy-pages:
    if: inputs.target == 'pages'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Download paper build artifact
        uses: actions/download-artifact@v4
        with:
          name: paper-build
          path: _build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    if: inputs.target == 'cloudflare'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download paper build artifact
        uses: actions/download-artifact@v4
        with:
          name: paper-build
          path: _build

      - name: Deploy to Cloudflare Pages
        id: cf-deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _build/html --project-name=${{ inputs.cf-project-name }} --branch=paper-${{ github.event.repository.name }}-${{ github.event.pull_request.number }}

      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          message: |
            Preview deployed!
            ${{ steps.cf-deploy.outputs.deployment-url }}
